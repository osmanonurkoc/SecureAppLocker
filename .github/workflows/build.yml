name: Build Windows Executables

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Version Tag (e.g. v1.1.1)'
        required: true
        default: 'v1.1.1'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # Mandatory for creating releases

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore Dependencies
      run: dotnet restore SecureAppLocker.sln -r win-x64

    - name: Build Service (Background Watchdog)
      run: |
        dotnet publish SecureAppLocker.Service/SecureAppLocker.Service.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          --no-restore `
          -o ./publish/Service

    - name: Build Manager (Dashboard)
      run: |
        dotnet publish SecureAppLocker.Manager/SecureAppLocker.Manager.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          --no-restore `
          -o ./publish/Manager

    - name: Build UI (Password Prompt)
      run: |
        dotnet publish SecureAppLocker.UI/SecureAppLocker.UI.csproj `
          -c Release `
          -r win-x64 `
          --self-contained true `
          --no-restore `
          -o ./publish/UI

    - name: Zip Release Artifacts
      shell: pwsh
      run: |
        $version = "${{ github.event.inputs.version_tag }}"
        if ([string]::IsNullOrEmpty($version)) { $version = "v1.1.$(Get-Date -Format 'yyMMdd')" }
        Compress-Archive -Path ./publish/* -DestinationPath ./SecureAppLocker-Release-$version.zip

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: SecureAppLocker-Windows-x64
        path: ./SecureAppLocker-Release-*.zip

    - name: Create GitHub Release
    if: github.event_name == 'workflow_dispatch'
    uses: softprops/action-gh-release@v2
    with:
        tag_name: ${{ github.event.inputs.version_tag }}
        name: SecureAppLocker ${{ github.event.inputs.version_tag }}
        files: SecureAppLocker-Release-${{ github.event.inputs.version_tag }}.zip
        generate_release_notes: true
    env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
